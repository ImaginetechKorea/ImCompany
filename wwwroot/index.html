<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ImCompany · 수주·매출 관리</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/chat.css"></head>
<body><div class="shell"><aside class="sidebar"><a class="brand" href="#dashboard"><span class="brand-icon">im</span><span>ImCompany<small>BUSINESS WORKSPACE</small></span></a><div class="workspace">ImCompany <span>로컬 워크스페이스</span></div><nav id="nav"></nav><div class="sidebar-bottom"><span class="dot"></span> 이 PC에 안전하게 저장<small>수주부터 입금까지, 한눈에.</small></div></aside><div class="main"><header class="topbar"><div class="breadcrumb">내 업무 <span>/</span> <b id="crumb">대시보드</b></div><div><span id="today"></span><button class="quiet" data-action="refresh">↻ 새로고침</button><button id="aiToggle" class="ai-button" data-action="toggle-ai">✧ AI 도우미</button></div></header><main id="content" tabindex="-1"></main><footer class="app-footer">ImCompany <span>·</span> 모든 금액은 KRW · 부가세 포함 기준 <span>·</span> <span id="sync">연결 중</span></footer></div><aside id="aiPanel" class="ai-panel" hidden><div class="ai-heading"><div><b>✧ AI 업무 도우미</b><small>말로 요청하고, 파일로 입력하세요</small></div><div class="actions"><button type="button" data-ai-action="clear-chat" class="ai-clear-chat">대화 지우기</button><button data-ai-action="new-chat" class="icon" title="새 대화" aria-label="새 대화">＋</button><button data-action="toggle-ai" class="icon" aria-label="AI 패널 닫기">×</button></div></div><div id="aiConnection" class="ai-connection">ChatGPT 연결 확인 중…</div><div id="aiContext"></div><div id="chatMessages" aria-live="polite"></div><div id="aiDropzone" class="ai-dropzone"><span>파일을 끌어 놓거나 Ctrl+V로 붙여 넣으세요</span><small>PDF · PNG · JPG 10MB · TXT 1MB</small><button type="button" data-ai-action="choose-file">＋ 파일 첨부</button><input type="file" id="aiFileInput" accept=".pdf,.png,.jpg,.jpeg,.txt" multiple hidden></div><div id="aiPendingFiles" class="ai-pending-files"></div><form id="chatForm"><input type="checkbox" id="allowDrafts" hidden><textarea id="chatInput" placeholder="텍스트를 붙여 넣거나 업무를 요청하세요" required maxlength="50000" aria-label="AI에게 요청할 내용"></textarea><div class="ai-send-row"><button id="chatClear" type="button" data-ai-action="clear-input">입력 지우기</button><button id="chatCancel" type="button" data-ai-action="cancel-task" hidden>중지</button><button id="chatSubmit" class="primary" type="submit">ChatGPT로 보내기 ↗</button></div></form><p class="ai-note">파일과 붙여 넣은 내용은 보내기를 눌렀을 때 AI로 전송됩니다.<br>입력안은 내용을 확인한 뒤 저장합니다.</p></aside></div><dialog id="modal"><div id="modalBody"></div></dialog><div id="toast" role="status" hidden></div><script src="/money-input.js"></script><script src="/app.js"></script><script src="/help.js"></script><script src="/details.js"></script><script src="/purchases.js"></script><script src="/chat.js"></script><script src="/chat-business.js"></script><script src="/tax-invoice.js"></script><script src="/date-copy.js"></script></body></html>
